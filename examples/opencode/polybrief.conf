# Settings for this example. Use model names available in your installed CLIs.
# OpenCode needs a model in provider/model form; the other model lines are optional.
timeout = 900

[codex]
model = gpt-6-sol
effort = medium
web = off

[claude]
model = sonnet
effort = high
web = off

[opencode]
model = openai/gpt-5
variant = high
web = off
