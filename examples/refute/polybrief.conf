# Settings for this example. Use model names available in your installed CLIs.
# Remove a model line to use that client's default.
# The pattern is selected by -p because refute.md is a file, not a built-in name.
workers = codex, claude
timeout = 900

[codex]
model = gpt-6-sol
effort = medium
web = off

[claude]
model = sonnet
effort = high
web = off
