<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How polybrief works</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · polybrief</p>
    <h1>How polybrief works</h1>

    <div class="diagram-container">
      <svg viewBox="0 56 960 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
        <title id="how-it-works-title">How polybrief works</title>
        <desc id="how-it-works-desc">Your agent sends a brief to polybrief, which runs a pattern that starts separate read-only Codex, Claude Code and OpenCode workers, OpenCode with any model, in your repository, and returns the answers to your agent, which verifies them and replies to you.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect x="0" y="56" width="960" height="416" fill="#f5f5f5"/>

        <!-- Zone: the repository the workers read -->
        <rect x="704" y="88" width="224" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="716" y="92" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="778" y="101" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR REPO · READ-ONLY</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- You → agent: task -->
        <line x1="128" y1="208" x2="200" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="146" y="190" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="164" y="199" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TASK</text>

        <!-- agent → You: reply -->
        <line x1="200" y1="232" x2="128" y2="232" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="146" y="238" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="164" y="247" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPLY</text>

        <!-- agent → polybrief: brief (headline path) -->
        <line x1="376" y1="208" x2="464" y2="208" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="402" y="190" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="199" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BRIEF</text>

        <!-- polybrief → agent: answers -->
        <line x1="464" y1="232" x2="376" y2="232" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="396" y="238" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="247" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANSWERS</text>

        <!-- polybrief → workers: fan-out -->
        <path d="M632,196 H670 Q678,196 678,188 V156 Q678,148 686,148 H724" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="632" y1="220" x2="724" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M632,244 H670 Q678,244 678,252 V290 Q678,298 686,298 H724" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>


        <!-- Nodes -->
        <!-- You (input) -->
        <rect x="32" y="188" width="96" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="188" width="96" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="40" y="194" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="54" y="203" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="80" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You</text>
        <text x="80" y="241" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ask &amp; decide</text>

        <!-- Your agent (backend) -->
        <rect x="200" y="180" width="176" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="180" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="208" y="186" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="226" y="195" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="288" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Your agent</text>
        <text x="288" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Claude Code, Codex, …</text>
        <text x="288" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verifies every answer</text>

        <!-- polybrief (focal) -->
        <rect x="464" y="172" width="168" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="464" y="172" width="168" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="472" y="178" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="486" y="187" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="548" y="210" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">polybrief</text>
        <text x="548" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">runs a pattern (-p):</text>
        <text x="548" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">parallel · twice · panel</text>
        <text x="548" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">crosscheck · intent</text>

        <!-- Workers -->
        <rect x="724" y="120" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="724" y="120" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="732" y="126" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="752" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="816" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Codex</text>
        <text x="816" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own session</text>

        <rect x="724" y="192" width="184" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="724" y="192" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="732" y="198" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="752" y="207" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="816" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Claude Code</text>
        <text x="816" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own session</text>

        <rect x="724" y="264" width="184" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="724" y="264" width="184" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="732" y="270" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="752" y="279" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
        <text x="816" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenCode</text>
        <text x="816" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">GPT, Gemini, Qwen, local, …</text>
        <text x="816" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">-o opencode.model=…</text>


        <!-- Callout -->
        <text x="704" y="368" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Each worker is a separate session.</text>
        <text x="704" y="386" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The pattern sets who answers, and when.</text>

        <!-- Legend -->
        <line x1="32" y1="420" x2="928" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="32" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="434" width="20" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="140" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">focal: polybrief</text>

        <line x1="272" y1="441" x2="300" y2="441" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="308" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the brief you send</text>

        <line x1="448" y1="441" x2="476" y2="441" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="484" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">return path</text>

      </svg>
    </div>
  </div>
</body>
</html>
